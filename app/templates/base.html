<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Miner Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/styles.css?v=1770486106">
</head>
<body class="app-bg">
  <div class="topbar px-3 py-2 d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center gap-2">
      <span class="bolt">⚡</span>
      <div class="brand">Miner Dashboard</div>
      <div class="muted small">local</div>
    </div>
    <div class="muted small">{% block top_right %}{% endblock %}</div>
  </div>

  <div class="container-fluid py-3">
    {% block content %}{% endblock %}
  </div>

  <script src="/static/app.js?v=1770486122"></script>
</body>
</html>
